          description: User created and invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUser" }
        "503": { description: Invitation delivery unavailable }

  /platform/organizations/{organizationId}/users/{userId}:
    patch:
      operationId: updatePlatformUser
      tags: [platform]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformUserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUser" }
        "404": { description: User not found in organization }

  /platform/organizations/{organizationId}/users/{userId}/reset-password:
