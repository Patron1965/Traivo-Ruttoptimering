                type: string
                nullable: true
              weightKg:
                type: number
                nullable: true
              volumeM3:
                type: number
                nullable: true
              contactName:
                type: string
                nullable: true
              contactEmail:
                type: string
                nullable: true
              contactPhone:
                type: string
                nullable: true
              externalRef:
                type: string
                nullable: true
              pickupAddress:
                type: string
                nullable: true
              pickupLatitude:
                type: number
                nullable: true
              pickupLongitude:
                type: number
                nullable: true
              jobType:
                type: string
                enum: [delivery, pickup_delivery, field_service]
              priority:
                type: integer
                nullable: true
              slaDeadline:
                type: string
                format: date-time
                nullable: true
              serviceCategory:
                type: string
                nullable: true
              serviceInstructions:
                type: string
                nullable: true
              requiredSkills:
