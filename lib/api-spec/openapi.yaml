      operationId: upsertServiceReport
      tags: [stops]
      summary: Create or update the service report for a field service stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceReportInput"
      responses:
        "200":
          description: Updated service report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceReportWithMaterials"
        "400":
          description: Validation error
        "404":
          description: Stop not found

  /organizations/{id}/billing-ready:
    get:
      operationId: listBillingReadyReports
      tags: [stops]
      summary: List billing-ready service reports for an organization (auditable export)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of billing-ready service reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingReadyReport"

components:
  parameters:
    DistrictPlanId:
      in: path
      name: planId
      required: true
      schema: { type: string, format: uuid }
    DistrictZoneId:
      in: path
      name: zoneId
      required: true
      schema: { type: string, format: uuid }
    DistrictJobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ReportCategoryConfiguration:
      type: object
      required: [revision, categories]
      properties:
        revision: { type: integer, minimum: 0 }
        categories:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/ReportCategoryEntry" }
    ReportCategoryEntry:
      type: object
      required: [id, label, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 80 }
        active: { type: boolean }
    PortalAccessToken:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$" }
    PortalCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    PortalEmail:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PortalPassword:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 256 }
    PortalIdentity:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PortalAccountInput:
      type: object
      required: [name, email, enabled, customerIds, stopIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        enabled: { type: boolean }
        customerIds: { type: array, maxItems: 200, items: { type: string, format: uuid } }
        stopIds: { type: array, maxItems: 500, items: { type: string, format: uuid } }
    PortalAccount:
      allOf:
        - { $ref: "#/components/schemas/PortalAccountInput" }
        - type: object
          required: [id, activated]
          properties:
            id: { type: string, format: uuid }
            activated: { type: boolean }
    PortalContactInput:
      type: object
      required: [name, phone, enabled]
      properties:
        name: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 40 }
        enabled: { type: boolean }
    PortalContact:
      allOf:
        - { $ref: "#/components/schemas/PortalContactInput" }
        - type: object
          required: [vehicleId]
          properties:
            vehicleId: { type: string, format: uuid }
    PortalOrderPage:
      type: object
      required: [items, total, nextCursor, asOf]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PortalOrder" } }
        total: { type: integer }
        nextCursor: { type: [string, "null"] }
        asOf: { type: string }
    PortalOrder:
      type: object
      required: [id, reference, address, date, timeWindowStart, timeWindowEnd, status]
      properties:
        id: { type: string, format: uuid }
        reference: { type: ["string", "null"] }
        address: { type: string }
        date: { type: ["string", "null"] }
        timeWindowStart: { type: ["string", "null"] }
        timeWindowEnd: { type: ["string", "null"] }
        status: { type: string, enum: [scheduled, started, on_the_way, completed, failed, skipped, cancelled, paused, unavailable] }
    PortalOrderDetail:
      type: object
      required: [order, contact, delivery, completedAt]
      properties:
        completedAt:
          type: [string, "null"]
          format: date-time
          description: Recorded completion time for this completed delivery only. Null if unknown; never inferred from planned or modified times.
        order: { $ref: "#/components/schemas/PortalOrder" }
        contact:
          type: [object, "null"]
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string }
        delivery: { $ref: "#/components/schemas/TrackingInfo" }
    CustomerNotificationEventTemplate:
      type: object
      additionalProperties: false
      required: [enabled, sms, subject, email]
      properties:
        enabled: { type: boolean }
        sms: { type: string, maxLength: 1600 }
        subject: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 5000 }
    CustomerSmsConfirmation:
      type: object
      additionalProperties: false
      required: [revision, confirmation, resend]
      properties:
        revision: { type: integer, minimum: -1 }
        confirmation: { type: string, pattern: "^[a-f0-9]{64}$" }
        resend: { type: boolean }
    CustomerSmsPreview:
      type: object
      required: [recipient, message, blockedReason, revision, confirmation, status]
      properties:
        recipient: { type: string }
        message: { type: string }
        blockedReason: { type: [string, "null"] }
        revision: { type: integer }
        confirmation: { type: string }
        status: { type: string }
    CustomerNotificationConfig:
      type: object
      additionalProperties: false
      required: [channel, events]
      properties:
        channel: { type: string, enum: [sms, email, both] }
        events:
          type: object
          additionalProperties: false
          required: [planned, approaching, completed]
          properties:
            planned: { $ref: "#/components/schemas/CustomerNotificationEventTemplate" }
            approaching: { $ref: "#/components/schemas/CustomerNotificationEventTemplate" }
            completed: { $ref: "#/components/schemas/CustomerNotificationEventTemplate" }
    CustomerNotificationSettingsInput:
      type: object
      required: [customerNotifications]
      properties:
        customerNotifications: { $ref: "#/components/schemas/CustomerNotificationConfig" }
    CustomerNotificationSettingsResponse:
      type: object
      properties:
        customerNotifications:
          anyOf:
            - { $ref: "#/components/schemas/CustomerNotificationConfig" }
            - { type: "null" }
    OrganizationServicePolicy:
      type: object
      additionalProperties: false
      required: [roadProvider, geocodingProvider, smsProvider, emailEnabled, aiEnabled, cuoptEnabled, districtEnabled]
      properties:
        preferredLoginService:
          type: string
          enum: [password, siths]
          description: Requested login service. Does not activate federation or disable password login.
        roadProvider:
          type: string
          enum: [inherit, disabled, osrm, geoapify]
        geocodingProvider:
          type: string
          enum: [inherit, disabled, google, nominatim]
        smsProvider:
          type: string
          enum: [inherit, disabled, linkmobility, twilio, 46elks]
        emailEnabled: { type: boolean }
        aiEnabled: { type: boolean }
        cuoptEnabled: { type: boolean }
        districtEnabled: { type: boolean }
    OrganizationServiceSettingsInput:
      type: object
      additionalProperties: false
      required: [revision, policy]
      properties:
        revision: { type: integer, minimum: 0 }
        policy: { $ref: "#/components/schemas/OrganizationServicePolicy" }
    OrganizationServiceSettings:
      type: object
      required: [organizationId, revision, policy]
      properties:
        sithsEligible: { type: boolean }
        activeLoginService: { type: string, enum: [password] }
        loginConnectionStatus: { type: string, enum: [active, not_configured] }
        organizationId: { type: string, format: uuid }
        revision: { type: integer }
        policy: { $ref: "#/components/schemas/OrganizationServicePolicy" }
    PlatformExternalService:
      type: object
      required: [id, name, description, state, detail]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [enabled, disabled, incomplete, available]
        detail:
          type: string
    DistrictIntakeSource:
      type: object
      required: [id, name, revision, headers, sourceRowCount, mappedRowCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        revision: { type: integer }
        headers: { type: array, items: { type: string } }
        sourceRowCount: { type: integer }
        mappedRowCount: { type: integer }
    DistrictIntakeMapping:
      type: object
      required: [objectNumber, address]
      properties:
        objectNumber: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        latitude: { type: string }
        longitude: { type: string }
        postalCode: { type: string }
        city: { type: string }
        postalCity: { type: string }
    DistrictIntakeSourceRow:
      type: object
      required: [sourceRowNumber, original]
      properties:
        sourceRowNumber: { type: integer, minimum: 1 }
        original: { type: object, additionalProperties: { type: string } }
        parseError: { type: string }
    DistrictIntakeInput:
      type: object
      required: [sourceKey, mapping, rows]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 200 }
        mapping: { $ref: '#/components/schemas/DistrictIntakeMapping' }
        rows:
          type: array
          minItems: 1
          maxItems: 20000
          items: { $ref: '#/components/schemas/DistrictIntakeSourceRow' }
    DistrictIntakeTransferInput:
      type: object
      required: [draftId, revision, mapping]
      properties:
        draftId: { type: string, format: uuid }
        revision: { type: integer, minimum: 0 }
        mapping: { $ref: '#/components/schemas/DistrictIntakeMapping' }
    DistrictIntakeSearchInput:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
        address: { type: string, minLength: 1, maxLength: 1000 }
    DistrictIntakeAcceptInput:
      type: object
      required: [revision, candidateIndex]
      properties:
        revision: { type: integer, minimum: 0 }
        candidateIndex: { type: integer, minimum: 0 }
        objectNumber: { type: string, minLength: 1, maxLength: 500 }
    DistrictIntakeCandidate:
      type: object
      required: [latitude, longitude, displayName]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        displayName: { type: string }
    DistrictIntakeRow:
      type: object
      required: [sourceRowNumber, original, objectNumber, address, status, reason]
      properties:
        sourceRowNumber: { type: integer }
        original: { type: object, additionalProperties: { type: string } }
        objectNumber: { type: string }
        address: { type: string }
        status: { type: string, enum: [ready, unresolved, rejected] }
        reason: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        pointId: { type: string, format: uuid }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/DistrictIntakeCandidate' }
    DistrictIntake:
      type: object
      required: [id, planId, revision, sourceKey, sourceDraftId, sourceDraftRevision, total, ready, unresolved, rejected, rows]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        revision: { type: integer }
        sourceKey: { type: string }
        sourceDraftId: { type: [string, 'null'], format: uuid }
        sourceDraftRevision: { type: [integer, 'null'] }
        total: { type: integer }
        ready: { type: integer }
        unresolved: { type: integer }
        rejected: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/DistrictIntakeRow' }
    DistrictIntakeEnvelope:
      type: object
      required: [intake]
      properties:
        intake:
          anyOf:
            - { $ref: '#/components/schemas/DistrictIntake' }
            - { type: 'null' }
    DistrictPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    DistrictPlan:
      type: object
      required: [id, name, revision, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
    DistrictPlanList:
      type: object
      required: [plans]
      properties:
        plans: { type: array, items: { $ref: '#/components/schemas/DistrictPlan' } }
    DistrictDetail:
      type: object
      required: [plan, zones, imports, jobs, exports]
      properties:
        plan: { $ref: '#/components/schemas/DistrictPlan' }
        zones: { type: array, items: { $ref: '#/components/schemas/DistrictZone' } }
        imports: { type: array, items: { $ref: '#/components/schemas/DistrictImport' } }
        jobs: { type: array, items: { $ref: '#/components/schemas/DistrictJob' } }
        exports: { type: array, items: { $ref: '#/components/schemas/DistrictExport' } }
    DistrictMapping:
      type: object
      required: [objectNumber, address, latitude, longitude]
      properties:
        objectNumber: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        latitude: { type: string, minLength: 1 }
        longitude: { type: string, minLength: 1 }
    DistrictImportInput:
      type: object
      required: [rows, mapping, sourceKey]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            oneOf:
              - { $ref: '#/components/schemas/DistrictSourceRow' }
              - type: object
                additionalProperties: { type: string }
        mapping: { $ref: '#/components/schemas/DistrictMapping' }
        sourceKey: { type: string, minLength: 1, maxLength: 200 }
    DistrictSourceRow:
      type: object
      description: Explicit physical 1-based source line identity. Include parseError for malformed parser rows, retaining raw cells; these count as rejected rather than disappearing.
      required: [sourceRowNumber, original]
      properties:
        sourceRowNumber: { type: integer, minimum: 1 }
        original:
          type: object
          additionalProperties: { type: string }
        parseError: { type: string }
    DistrictImportCommit:
      allOf:
        - { $ref: '#/components/schemas/DistrictImportInput' }
        - type: object
          required: [confirmValidOnly]
          properties:
            confirmValidOnly: { type: boolean }
    DistrictIssue:
      type: object
      required: [rowNumber, reason]
      properties:
        rowNumber: { type: integer }
        reason: { type: string }
    DistrictDuplicate:
      type: object
      required: [rowNumber, otherRowNumber]
      properties:
        rowNumber: { type: integer }
        otherRowNumber: { type: integer }
    DistrictImportPreview:
      type: object
      required: [total, valid, rejected, issues, duplicateCandidates]
      properties:
        total: { type: integer }
        valid: { type: integer }
        rejected: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/DistrictIssue' } }
        duplicateCandidates: { type: array, items: { $ref: '#/components/schemas/DistrictDuplicate' } }
    DistrictImport:
      type: object
      required: [id, total, valid, rejected, revision]
      properties:
        id: { type: string, format: uuid }
        total: { type: integer }
        valid: { type: integer }
        rejected: { type: integer }
        revision: { type: integer }
    DistrictPoint:
      type: object
      required: [id, sourceRowNumber, objectNumber, address, latitude, longitude, original, zoneId, exported]
      properties:
        id: { type: string, format: uuid }
        sourceRowNumber: { type: integer }
        objectNumber: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        original: { type: object, additionalProperties: { type: string } }
        zoneId: { type: ['string','null'], format: uuid }
        exported: { type: boolean }
    DistrictPointList:
      type: object
      required: [points, total]
      properties:
        points: { type: array, items: { $ref: '#/components/schemas/DistrictPoint' } }
        total: { type: integer }
    DistrictVertex:
      type: object
      required: [lat,lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    DistrictZoneInput:
      type: object
      required: [name,color,pointIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        pointIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        transfers: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        polygon: { type: array, items: { $ref: '#/components/schemas/DistrictVertex' } }
    DistrictZoneUpdate:
      allOf:
        - { $ref: '#/components/schemas/DistrictZoneInput' }
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 0 }
    DistrictZoneDelete:
      type: object
      required: [expectedRevision,confirm]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        confirm: { type: boolean, enum: [true] }
    DistrictZone:
      type: object
      required: [id,name,color,revision,pointIds,deletedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        revision: { type: integer }
        pointIds: { type: array, items: { type: string, format: uuid } }
        polygon: { type: ['array','null'], items: { $ref: '#/components/schemas/DistrictVertex' } }
        deletedAt: { type: ['string','null'], format: date-time }
    DistrictLocation:
      type: object
      properties:
        pointId: { type: string, format: uuid }
        latitude: { type: number }
        longitude: { type: number }
    DistrictJobInput:
      type: object
      required: [expectedRevision,mode,start]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        mode: { type: string, enum: [loop,open] }
        start: { $ref: '#/components/schemas/DistrictLocation' }
        end: { $ref: '#/components/schemas/DistrictLocation' }
        serviceMinutes: { type: number, minimum: 0, maximum: 1440 }
        bulkScope: { type: string, enum: [zone,plan] }
        bulkPreviewHash: { type: string, maxLength: 64 }
        distanceExceptions: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DistrictDistanceException' } }
    DistrictDistanceException:
      type: object
      required: [pointId,maxSnapMeters,reason]
      properties:
        pointId: { type: string, format: uuid }
        maxSnapMeters: { type: integer, minimum: 251, maximum: 1000 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    DistrictBulkPreview:
      type: object
      required: [ready,sourceCount,positionedCount,unresolvedCount,matrixBytes,tableRequests,warnings]
      properties:
        ready: { type: boolean }
        sourceCount: { type: integer }
        positionedCount: { type: integer }
        unresolvedCount: { type: integer }
        matrixBytes: { type: number }
        tableRequests: { type: integer }
        previewHash: { type: string }
        datasetIdentity: { type: string }
        warnings: { type: array, items: { type: string } }
    DistrictResult:
      type: object
      required: [orderedPointIds,distanceMeters,driveSeconds,geometry,warnings]
      properties:
        orderedPointIds: { type: array, items: { type: string, format: uuid } }
        distanceMeters: { type: number }
        driveSeconds: { type: number }
        geometry: { type: array, items: { $ref: '#/components/schemas/DistrictGeometryPoint' } }
        warnings: { type: array, items: { type: string } }
    DistrictGeometryPoint:
      type: object
      required: [latitude,longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }
    DistrictJob:
      type: object
      required: [id,zoneId,revision,status,progress,mode,start,serviceMinutes,createdAt]
      properties:
        id: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        revision: { type: integer }
        status: { type: string, enum: [queued,running,completed,failed,cancelled,stale] }
        progress: { type: integer }
        mode: { type: string, enum: [loop,open] }
        start: { $ref: '#/components/schemas/DistrictLocation' }
        end: { $ref: '#/components/schemas/DistrictLocation' }
        serviceMinutes: { type: number }
        bulkScope: { type: string, enum: [zone,plan] }
        datasetIdentity: { type: string }
        result: { $ref: '#/components/schemas/DistrictResult' }
        error: { type: ['string','null'] }
        createdAt: { type: string, format: date-time }
    DistrictJobDetail:
      type: object
      required: [job]
      properties:
        job: { $ref: '#/components/schemas/DistrictJob' }
        result: { $ref: '#/components/schemas/DistrictResult' }
    DistrictJobEnvelope:
      type: object
      required: [job]
      properties:
        job: { $ref: '#/components/schemas/DistrictJob' }
    DistrictExportInput:
      type: object
      required: [pointIds,columns,confirmReexport]
      properties:
        pointIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        columns: { type: array, uniqueItems: true, items: { type: string } }
        confirmReexport: { type: boolean }
    DistrictExport:
      type: object
      required: [id,jobId,actorId,pointIds,createdAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        pointIds: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
    DistrictExportEnvelope:
      type: object
      required: [export,overlapPointIds]
      properties:
        export: { $ref: '#/components/schemas/DistrictExport' }
        overlapPointIds: { type: array, items: { type: string, format: uuid } }
    DistrictExportList:
      type: object
      required: [exports]
      properties:
        exports: { type: array, items: { $ref: '#/components/schemas/DistrictExport' } }
    WorkspaceInput:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
    WorkspaceContext:
      type: object
      required: [organizationId, organizationName, expiresAt]
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        expiresAt: { type: string, format: date-time }
    WorkspaceGrant:
      allOf:
        - $ref: "#/components/schemas/WorkspaceContext"
        - type: object
          required: [token]
          properties:
            token: { type: string }
    SupportAccessInput:
      type: object
      required: [organizationId, reason]
      properties:
        organizationId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 5
          maxLength: 500
    SupportAccessGrant:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    SupportSummary:
      type: object
      required: [organization, userCount, reason, expiresAt, readOnly]
      properties:
        organization:
          type: object
          required: [id, name, operatingMode]
          properties:
            id:
              type: string
            name:
              type: string
            operatingMode:
              type: string
        userCount:
          type: integer
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
        readOnly:
          type: boolean
    PlatformCuoptStatus:
      type: object
      required: [keyPresent, functionIdConfigured, versionIdConfigured, state, message]
      properties:
        keyPresent: { type: boolean }
        functionIdConfigured: { type: boolean }
        versionIdConfigured: { type: boolean }
        state:
          type: string
          enum: [not_checked, missing_config, invalid_config, metadata_active, metadata_inactive, auth_failed, not_found, timeout, unavailable, invalid_response]
        message: { type: string }
    PlatformRoutingServerStatus:
      type: object
      additionalProperties: false
      required: [id, name, configured]
      properties:
        id: { type: string }
        name: { type: string }
        configured: { type: boolean }
        error: { type: string }
    PlatformRoutingStatus:
      type: object
      additionalProperties: false
      required: [shared, dedicated]
      properties:
        shared: { $ref: "#/components/schemas/PlatformRoutingServerStatus" }
