                type: object
                properties: { message: { type: string } }
                required: [message]

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Consume a password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetBody" }
      responses:
        "200":
          description: Password reset completed
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
                required: [message]
        "400":
          description: Invalid or expired reset token

  /app-users/{id}/driver-link:
