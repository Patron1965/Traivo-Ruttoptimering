      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationLifecycleInput" }
      responses:
        "204": { description: "Organization archived, restored or permanently deleted" }
        "409": { description: Active work or protected organization prevents this operation }
        "403": { description: Platform access required }
        "400": { description: Invalid confirmation }

  /platform/organizations/{organizationId}/users:
    get:
      operationId: listPlatformUsers
