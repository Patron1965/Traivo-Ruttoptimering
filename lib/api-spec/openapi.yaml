    post:
      operationId: moveDispatchStops
      tags: [stops]
      summary: Atomically move stops or transfer unsent stops into a new project draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchStopMoveInput"
      responses:
        "200":
          description: Stops moved and affected routes resequenced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchStopMoveResponse"
        "404":
          description: Stop or route not found
        "409":
          description: The prospective routes are invalid or require an explicit override
        "503":
          description: DISPATCH_TARGET_UNAVAILABLE — recipient planning evidence or verified optimization is unavailable; nothing committed

  /stops/dispatch-move/preview:
    post:
      operationId: previewDispatchStopMove
      tags: [stops]
      summary: Preview a dispatch move or a new project draft without mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchStopMovePreviewInput"
      responses:
        "200":
          description: Move feasibility and soft conflicts for the prospective target route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchStopMovePreviewResponse"
        "404":
          description: One or more stops or the target route were not found
        "409":
          description: Stops or routes are ineligible, locked, violate hard constraints, or have stale revisions
        "503":
          description: DISPATCH_TARGET_UNAVAILABLE — recipient planning evidence or verified optimization is unavailable; no executable proposal produced

  /stops/dispatch-defer:
    post:
      operationId: deferDispatchStops
      tags: [stops]
      summary: Atomically defer pending dispatch stops to a future Stockholm workday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchStopDeferInput"
      responses:
        "200":
          description: Stops deferred and source routes resequenced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchStopDeferResponse"
        "404":
          description: One or more stops or source routes were not found
        "409":
          description: Stops are ineligible or a source route revision is stale

  /stops/{id}/proof:
    post:
      operationId: submitProof
      tags: [stops]
      summary: Submit proof of delivery for a stop (photo via multipart, signature/barcode via JSON)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProofBody"
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                notes:
                  type: string
              required:
                - photo
      responses:
        "201":
          description: Created proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryProof"
        "400":
          description: Invalid request
        "404":
          description: Stop not found
        "502":
          description: Storage upload failed

  /stops/{id}/proofs:
    get:
      operationId: getStopProofs
      tags: [stops]
      summary: Get all proofs of delivery for a stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of proofs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryProof"

  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List all routes
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, optimized, in_progress, completed, cancelled]
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteBody"
      responses:
        "201":
          description: Created route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"

  /routes/bulk-delete:
    post:
      operationId: deleteRoutesBulk
      tags: [routes]
      summary: Atomically remove selected routes and release unfinished orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteDeletionSelection"
      responses:
        "200":
          description: All selected routes were removed (historical/live routes may be archived)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDeletionResult"
        "400":
          description: Invalid selection
        "401":
          description: Authentication required
        "403":
          description: Administrator or dispatcher permission required
        "404":
          description: One or more selected routes could not be found
        "409":
          description: No routes deleted because the selection contains protected routes

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Route details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    put:
      operationId: updateRoute
      tags: [routes]
      summary: Update a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteBody"
      responses:
        "200":
          description: Updated route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Remove a route, archiving it when its operational history must be retained
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteDeletionConfirmation"
      responses:
        "204":
          description: Deleted

  /routes/{id}/dispatch-snapshot:
    get:
      operationId: getRouteDispatchSnapshot
      tags: [routes]
      summary: Read immutable evidence of the latest actual approved dispatch
      description: Admin/dispatcher or the assigned driver only. Legacy handoffs without captured evidence return 409; current working data is never synthesized as a dispatch snapshot.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Captured outgoing version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDispatchSnapshot"
        "403":
          description: No access
        "404":
          description: Route not found
        "409":
          description: No authentic outgoing snapshot for this handoff

  /routes/{id}/planning-locks:
    put:
      operationId: setRoutePlanningLocks
      tags: [routes]
      summary: Set or explicitly release persistent planning locks
      description: Exact service-start minute with zero tolerance. Lock changes require current revision and admin or dispatcher role. Existing non-null locks must be explicitly released before replacement.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePlanningLockInput"
      responses:
        "200":
          description: Updated route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid input or missing explicit instant
        "403":
          description: Administrator or dispatcher required
        "404":
          description: Route or stop not found in tenant
        "409":
          description: Stale revision, immutable history or planning lock conflict

  /routes/{id}/locked-first-stop:
    put:
      operationId: setLockedFirstStop
      tags: [routes]
      summary: Lock or unlock the first customer stop on a route
      description: Pins a pending stop on this route as the first customer job through route reoptimization. Null unlocks the route; EV charging entries may still precede the customer stop.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedFirstStopBody"
      responses:
        "200":
          description: Updated route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Administrator or dispatcher permission required
        "404":
          description: Route not found
        "409":
          description: Stale revision or first-stop invariant conflict

  /routes/{id}/stops:
    get:
      operationId: getRouteStops
      tags: [routes]
      summary: Get stops for a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of stops for the route
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stop"

  /routes/{id}/preflight:
    get:
      operationId: getRoutePreflight
      tags: [routes]
      summary: Validate that a route can be dispatched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispatch readiness and blocking issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePreflight"
        "404":
          description: Route not found

  /routes/{id}/export:
    get:
      operationId: exportRoute
      tags: [routes]
      summary: Export route as CSV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /routes/{id}/dispatch:
    post:
      operationId: dispatchRoute
      tags: [routes]
      summary: Publish a route and notify its assigned driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteDispatchInput"
      responses:
        "200":
          description: Route publication and notification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDispatchResult"
        "404":
          description: Route or assigned driver not found
        "409":
          description: The imported route plan has not passed final manual review

  /routes/{id}/resend-sms:
    post:
      operationId: resendRouteSms
      tags: [routes]
      summary: Resend the current route SMS to its saved handoff driver
      description: Resends notification only. The body driverId is an expected-recipient guard and never changes route assignment or handoff state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteResendSmsInput"
      responses:
        "200":
          description: SMS resend result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResendSmsResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResendSmsError"
        "403":
          description: Admin or dispatcher role required
        "404":
          description: Route not found in the authenticated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResendSmsError"
        "409":
          description: The route handoff is missing, stale, inactive, or has a different saved recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResendSmsError"
        "429":
          description: SMS resend rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResendSmsError"
        "500":
          description: Safe internal send error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResendSmsError"

  /routes/{id}/acknowledgement:
    get:
      operationId: getRouteAcknowledgement
      tags: [routes]
      summary: Get the current route-handoff display projection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Read-only projection of the current versioned route handoff, or null when it has not been sent
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RouteAcknowledgement"
                  - type: "null"
        "404":
          description: Route not found or unavailable to the current driver
  /routes/{id}/handoff:
    post:
      operationId: updateRouteHandoff
      tags: [routes]
      summary: Record the exact dispatched driver's receipt and acceptance of the current route version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteHandoffInput" }
      responses:
        "200":
          description: Updated route handoff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "409":
          description: Stale version or invalid transition

  /routes/{id}/execution-redistribution/approve:
    post:
      operationId: approveExecutionRedistribution
      tags: [routes]
      summary: Approve a pending execution redistribution suggestion
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planVersion]
              properties:
                planVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Suggestion approved; redistribution remains an explicit planner action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "409":
          description: Stale version or no pending suggestion

  /routes/{id}/incidents:
    get:
      operationId: listRouteIncidents
      tags: [routes]
      summary: List structured incidents reported for a route
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Route incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RouteIncident" }
    post:
      operationId: createRouteIncident
      tags: [routes]
      summary: Report a structured route incident as the exact dispatched driver
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRouteIncidentBody" }
      responses:
        "201":
          description: Created incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteIncident" }

  /routes/{id}/reoptimization/preview:
    post:
      operationId: previewRouteReoptimization
      tags: [routes]
      summary: Preview reordering only the selected route's pending remaining stops
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/RouteReoptimizationPreviewInput" }
      responses:
        "200":
          description: A non-persisted route-scoped proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReoptimizationResult" }
        "409":
          description: The route revision is stale

  /routes/{id}/reoptimization/apply:
    post:
      operationId: applyRouteReoptimization
      tags: [routes]
      summary: Atomically apply a route-scoped pending-stop proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/RouteReoptimizationApplyInput" }
      responses:
        "200":
          description: Applied route with its new revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteReoptimizationResult" }
        "409":
          description: Route, stops, vehicle, or driver changed after preview

  /import/route-plans/{planId}/reoptimization/preview:
    post:
      operationId: previewImportRoutePlanReoptimization
      tags: [planning]
      summary: Preview a whole-plan reoptimization without persisting changes
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WholePlanReoptimizationPreviewInput"
      responses:
        "200":
          description: Non-persisted whole-plan proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WholePlanReoptimizationResult"
        "409":
          description: The named plan, route revisions, resources, or execution state is stale

  /import/route-plans/{planId}/reoptimization/apply:
    post:
      operationId: applyImportRoutePlanReoptimization
      tags: [planning]
      summary: Atomically apply a whole-plan proposal across the selected resource set
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WholePlanReoptimizationApplyInput"
      responses:
        "200":
          description: Applied whole-plan proposal with new route revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WholePlanReoptimizationResult"
        "409":
          description: The preview token or any route, stop, resource, draft, or execution revision is stale

  /import/route-plans:
    post:
      operationId: createImportRoutePlan
      tags: [optimize]
      summary: Optimize selected unplanned stops directly against selected vehicle-driver pairs and persist feasible routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRoutePlanInput"
      responses:
        "200":
          description: Persisted routes and genuinely blocked stops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRoutePlanResult"
        "400":
          description: Invalid stops, pairs, or routing constraints

  /import/route-plans/progress/{progressId}:
    get:
      operationId: getImportRoutePlanProgress
      tags: [planning]
      summary: Get durable progress for an import route plan
      parameters:
        - name: progressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current server-side progress or the persisted result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRoutePlanProgress"
        "404":
          description: Progress not found in the authenticated organization

  /import/route-plans/{planId}/approval:
    get:
      operationId: getImportRoutePlanApproval
      tags: [planning]
      summary: Get authoritative approval state for the current route plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current route revisions, recipients, and explicit approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRoutePlanApprovalResult"
        "404":
          description: Route plan not found in the authenticated organization
  /import/route-plans/{planId}/approve:
    post:
      operationId: approveImportRoutePlan
      tags: [planning]
      summary: Explicitly approve exact route revisions and driver recipients
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRoutePlanApprovalInput"
      responses:
        "200":
          description: Current route summaries after the atomic approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRoutePlanApprovalResult"
        "400":
          description: Invalid approval request
        "404":
          description: Route plan not found in the authenticated organization
        "409":
          description: A route revision or exact recipient is stale

  /import/route-adjustments/preview:
    post:
      operationId: previewAssignedRouteAdjustments
      tags: [optimize]
      summary: Preview the complete unsaved manual adjustment draft without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteAdjustmentInput"
      responses:
        "200":
          description: Complete draft eligibility, revision/facts fingerprint and before/after clocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteAdjustmentPreview"
        "409":
          description: Plan, resources or locks changed; no adjustment saved

  /import/route-adjustments:
    post:
      operationId: adjustAssignedRoutes
      tags: [optimize]
      summary: Atomically save and revalidate manual adjustments to assigned routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteAdjustmentInput"
      responses:
        "200":
          description: Revalidated routes with recalculated metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteAdjustmentResult"
        "400":
          description: Invalid adjustment, incomplete stop set, or infeasible route
        "409":
          description: The route plan changed after it was loaded

  /import/route-plans/{planId}/reoptimize-service-time:
    post:
      operationId: reoptimizeImportRoutePlan
      tags: [optimize]
      summary: Atomically reoptimize an unpublished imported plan with a selected resource set
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPlanServiceTimeReoptimizationInput"
      responses:
        "200":
          description: Reoptimized routes with canonical server itineraries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteAdjustmentResult"
        "400":
          description: Invalid or infeasible service-time change
        "409":
          description: The complete plan changed after it was loaded

  /import/route-plans/{planId}/reoptimize-planning-inputs:
    post:
      operationId: reoptimizeImportRoutePlanPlanningInputs
      tags: [planning]
      summary: Atomically reoptimize a protected plan using persisted planning inputs
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningInputsReoptimizationInput"
      responses:
        "200":
          description: Current route revisions and planning outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningInputsReoptimizationResult"
        "400":
          description: Invalid planning inputs
        "409":
          description: Draft, route, or resource changed; reload and retry

  /import/route-plans/{planId}/planning-summary:
    get:
      operationId: getImportRoutePlanPlanningSummary
      tags: [planning]
      summary: Get planning inputs, plan metadata, and priority/reserve outcome
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current planning summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningSummaryResponse"
        "404":
          description: Route plan not found

  /planning-drafts:
    get:
      operationId: listPlanningDrafts
      tags: [planning]
      summary: List named planning drafts in the authenticated organization
      responses:
        "200":
          description: Planning drafts
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts:
                    type: array
