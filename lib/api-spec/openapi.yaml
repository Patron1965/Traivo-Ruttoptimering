        schema: { type: string, format: uuid }
    get:
      operationId: getPlatformOrganizationServices
      tags: [platform]
      responses:
        "200":
          description: Current customer-specific service permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationServiceSettings" }
        "403": { description: Platform access required }
        "404": { description: Organization not found }
    put:
      operationId: updatePlatformOrganizationServices
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationServiceSettingsInput" }
      responses:
        "200":
          description: Saved customer-specific service permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationServiceSettings" }
        "400": { description: Invalid policy or provider not configured }
        "403": { description: Platform access required }
        "404": { description: Organization not found }
        "409": { description: Settings changed; reload before saving }
  /platform/services:
    get:
      operationId: listPlatformServices
      tags: [platform]
      summary: Read external service configuration (platform administrators only)
      responses:
        "200":
          description: Configuration evidence only; does not perform external checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformExternalService"
        "403":
          description: Platform administrator access required
  /platform/routing:
    get:
      operationId: getPlatformRouting
      tags: [platform]
      description: Safe operator-configured routing provider status and catalog; endpoint URLs and credentials are never returned.
      responses:
        "200":
          description: Shared provider and allowlisted dedicated server metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformRoutingStatus" }
        "403": { description: Platform access required }
  /platform/organizations/{organizationId}/routing:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPlatformOrganizationRouting
      tags: [platform]
      responses:
        "200":
          description: Organization provider assignment and safe effective status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganizationRouting" }
        "403": { description: Platform access required }
        "404": { description: Organization not found }
    put:
      operationId: updatePlatformOrganizationRouting
      tags: [platform]
      description: Assign an operator-allowlisted server ID, or null to inherit the shared default. URLs are never accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformOrganizationRoutingUpdate" }
      responses:
        "200":
          description: Updated organization provider assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganizationRouting" }
        "400": { description: Invalid or unconfigured server ID }
        "403": { description: Platform access required }
        "404": { description: Organization not found }
  /platform/organizations:
    get:
      operationId: listPlatformOrganizations
      tags: [platform]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: includeArchived, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Paginated organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganizationPage" }
        "403": { description: Platform access required }
    post:
      operationId: createPlatformOrganization
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformOrganizationInput" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganization" }
        "403": { description: Platform access required }

  /platform/organizations/{organizationId}:
    patch:
      operationId: updatePlatformOrganization
      tags: [platform]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformOrganizationUpdate" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganization" }
        "400": { description: Invalid organization fields }
