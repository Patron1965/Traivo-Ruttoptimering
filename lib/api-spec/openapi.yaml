        - stops

    ImportStopsResponse:
      type: object
      properties:
        imported:
          type: integer
        receivedRowCount:
          type: integer
        savedRowCount:
          type: integer
        stops:
          type: array
          items:
            $ref: "#/components/schemas/Stop"
        rowResults:
          type: array
          items:
            type: object
            properties:
              sourceRowNumber:
                type: integer
              status:
                type: string
                enum: [saved]
              stopId:
                type: string
                format: uuid
            required: [sourceRowNumber, status, stopId]
      required:
        - imported
        - receivedRowCount
        - savedRowCount
        - stops
        - rowResults

    ImportStopsCountMismatchError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ImportStopsRejectedRow:
      type: object
      properties:
        sourceRowNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [rejected]
        reasons:
          type: array
          minItems: 1
          items:
            type: string
      required: [sourceRowNumber, status, reasons]

    ImportStopsValidationError:
      type: object
      properties:
        error:
          type: string
        failedAddresses:
          type: array
          items:
            type: string
        failedPickupAddresses:
          type: array
          items:
            type: string
        rowResults:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImportStopsRejectedRow"
      required: [error, failedAddresses, failedPickupAddresses, rowResults]

    DepotVerificationInput:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address: { type: string, minLength: 5, maxLength: 500 }
        postalCode: { type: string }
        city: { type: string }
        countryCode: { type: string, minLength: 2, maxLength: 2 }

    RouteDepotEndpoint:
      type: object
      required: [address, latitude, longitude, verifiedAt, verification]
      properties:
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        verifiedAt: { type: string, format: date-time }
        verification: { type: object, additionalProperties: true }

    RouteDepotSnapshot:
      type: object
      required: [start, end]
      properties:
        start: { $ref: "#/components/schemas/RouteDepotEndpoint" }
        end: { $ref: "#/components/schemas/RouteDepotEndpoint" }

    RouteWorkdayTimelineItem:
      type: object
      required: [type, startAt, endAt, durationMin]
      properties:
        type:
          type: string
          enum:
            [
              depot_start,
              driving,
              travel_reserve,
              waiting,
              service,
              stop_reserve,
              break,
              charging,
              return,
              depot_end,
            ]
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        durationMin: { type: number }
        stopId: { type: string }
        distanceKm: { type: number }
        rawDurationMin: { type: number }

    RouteWorkdaySummary:
      type: object
      required:
        [
          shiftMin,
          nonReturnDrivingMin,
          serviceMin,
          waitingMin,
          breakMin,
          returnMin,
          totalMin,
          marginMin,
          overtimeMin,
          shiftEndAt,
        ]
      properties:
        shiftMin: { type: number }
        nonReturnDrivingMin: { type: number }
        serviceMin: { type: number }
        waitingMin: { type: number }
        breakMin: { type: number }
        returnMin: { type: number }
        travelReserveMin: { type: number }
        stopReserveMin: { type: number }
        totalMin: { type: number }
        marginMin: { type: number }
        overtimeMin: { type: number }
        shiftEndAt: { type: string, format: date-time }
        allowedOvertimeMin: { type: number }
        allowLateStopsMin: { type: number }
        lateStopIds:
          type: array
          items: { type: string }
        warningCodes:
          type: array
          items:
            type: string
            enum: [OVERTIME_WITHIN_TOLERANCE, LATE_STOP_WITHIN_TOLERANCE]

    DepotVerificationResponse:
      type: object
      required:
        [endpoint, address, latitude, longitude, provider, verifiedAt, settings]
      properties:
        endpoint: { type: string, enum: [start, end] }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        provider: { type: string, enum: [google, nominatim] }
        verifiedAt: { type: string, format: date-time }
        settings:
          type: object
          additionalProperties: true

    RouteDeletionSelection:
      type: object
      required: [routeIds, confirmLiveRouteRemoval]
      properties:
        routeIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
        confirmLiveRouteRemoval:
          type: boolean
          description: Must be true to remove a route that is live, dispatched, or accepted.
    RouteDeletionConfirmation:
      type: object
      required: [confirmLiveRouteRemoval]
      properties:
        confirmLiveRouteRemoval:
          type: boolean
          description: Must be true to remove a route that is live, dispatched, or accepted.
    RouteDeletionResult:
      type: object
      required: [deletedRouteIds, deletedCount, archivedRouteIds, archivedCount]
      properties:
        deletedRouteIds:
          type: array
          items:
            type: string
            format: uuid
        deletedCount:
          type: integer
          minimum: 0
        archivedRouteIds:
          type: array
          description: Routes retained as cancelled archives because they have live execution, approvals, or history.
          items:
            type: string
            format: uuid
        archivedCount:
          type: integer
          minimum: 0
    RouteMapLocation:
      type: [object, "null"]
      description: Historical planning coordinate for map display only; not evidence of provider verification.
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    RouteMapEndpoints:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          $ref: "#/components/schemas/RouteMapLocation"
        end:
          $ref: "#/components/schemas/RouteMapLocation"
    Route:
      type: object
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        draftId:
          type: string
          format: uuid
          nullable: true
        organizationId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        status:
          type: string
          enum: [draft, optimized, in_progress, completed, cancelled]
        manualReviewRequired:
          type: boolean
        manualReviewedAt:
          type: string
          format: date-time
          nullable: true
        planRevision:
          type: integer
          minimum: 0
        optimizationFrozen:
          type: boolean
          default: false
        dispatchSnapshotVersion:
          type: [integer, "null"]
          description: Actual captured outgoing revision; null for legacy handoffs without evidence.
        lockedFirstStopId:
          type: string
          format: uuid
          nullable: true
        handoffStatus:
          type: string
          enum: [pending, sent, received, opened, accepted, rejected]
        handoffVersion:
          type: integer
          nullable: true
        handoffDriverId:
          type: string
          format: uuid
          nullable: true
        sentAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        openedAt: { type: string, format: date-time, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        date:
          type: string
          format: date-time
        totalDistanceKm:
          type: number
          nullable: true
        totalDurationMin:
          type: number
          nullable: true
        totalStops:
          type: integer
        co2EmissionsKg:
          type: number
          nullable: true
        plannerItinerary:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/OptimizedStop"
        geographicOverlapExplanation:
          allOf:
            - $ref: "#/components/schemas/GeographicOverlapExplanation"
          nullable: true
        mapEndpoints:
          allOf:
            - $ref: "#/components/schemas/RouteMapEndpoints"
          readOnly: true
          description: Immutable planning start/end coordinates, preferring depotSnapshot then frozen resource coordinates. Each missing or invalid position is null. Never uses current driver data and makes no verification claim.
        depotSnapshot:
          allOf:
            - $ref: "#/components/schemas/RouteDepotSnapshot"
          nullable: true
          description: Immutable, provider-verified start/end depot snapshot used when this route was planned.
        workdayTimeline:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RouteWorkdayTimelineItem"
        workdaySummary:
          allOf:
            - $ref: "#/components/schemas/RouteWorkdaySummary"
          nullable: true
        customerReference:
          type: string
          nullable: true
        sharedInstructions:
          type: string
          nullable: true
        optimizationPlanningSnapshot:
          allOf:
            - $ref: "#/components/schemas/PlanningInputs"
          nullable: true
        planningSummary:
          allOf:
            - $ref: "#/components/schemas/PlanningSummary"
          nullable: true
        executionProjection:
          type: object
          nullable: true
          additionalProperties: true
        redistributionSuggestion:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - planId
        - organizationId
        - name
        - status
        - manualReviewRequired
        - manualReviewedAt
        - planRevision
        - handoffStatus
        - date
        - totalStops
        - geographicOverlapExplanation
        - createdAt
        - updatedAt

    RouteHandoffInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [received, opened, accepted, rejected]
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required: [status, version]

    CreateRouteIncidentBody:
      type: object
      additionalProperties: false
      properties:
        category:
          type: string
          enum:
            [
              traffic,
              vehicle_issue,
              accident,
              customer_unavailable,
              access_problem,
              weather,
              safety,
              other,
            ]
        comment:
          type: string
          minLength: 1
          maxLength: 4000
        attachmentUrl:
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 2048
      required: [category, comment]

    RouteIncident:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        category:
          type: string
          enum:
            [
              traffic,
              vehicle_issue,
              accident,
              customer_unavailable,
              access_problem,
              weather,
              safety,
              other,
            ]
        comment: { type: string }
        attachmentUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required:
        [id, organizationId, routeId, driverId, category, comment, createdAt]

    CreateRouteBody:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        date:
          type: string
          format: date-time
      required:
        - organizationId
        - name
        - date

    UpdateRouteBody:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        status:
          type: string
          enum: [draft, optimized, in_progress, completed, cancelled]
        planRevision:
          type: integer
          minimum: 0
        date:
          type: string
          format: date-time
        totalDistanceKm:
          type: number
          nullable: true
        totalDurationMin:
          type: number
          nullable: true
        totalStops:
          type: integer
        co2EmissionsKg:
          type: number
          nullable: true

    LockedFirstStopBody:
      type: object
      additionalProperties: false
      properties:
        stopId:
          type: string
          format: uuid
          nullable: true
        planRevision:
          type: integer
          minimum: 0
      required: [stopId, planRevision]

    RouteDispatchInput:
      type: object
      properties:
        sendSms:
          type: boolean
          description: Set false to publish to the driver without an SMS notification.
        planRevision:
          type: integer
          minimum: 0
          description: Optional expected working version, checked atomically before dispatch.
        driverId:
          type: string
          format: uuid
      required:
        - driverId

    RoutePreflightIssue:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message

    RoutePreflight:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planRevision:
          type: integer
          minimum: 0
        ready:
          type: boolean
        driverId:
          type: string
          format: uuid
          nullable: true
        issues:
          type: array
          items:
            $ref: "#/components/schemas/RoutePreflightIssue"
      required:
        - routeId
        - planId
        - planRevision
        - ready
        - driverId
        - issues

    RouteDispatchSmsResult:
      type: object
      properties:
        status:
          type: string
          description: For an idempotent retry, delivery is unknown because the original notification is never sent again.
          enum: [sent, not_configured, missing_phone, failed, unknown, skipped]
        sent:
          type: boolean
        message:
          type: string
      required:
        - status
        - sent
        - message

    RouteDispatchResult:
      type: object
      properties:
        ok:
          type: boolean
        routeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [in_progress]
        sms:
          $ref: "#/components/schemas/RouteDispatchSmsResult"
      required:
        - ok
        - routeId
        - status
        - sms

    RouteResendSmsInput:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          format: uuid
      required:
        - driverId

    RouteResendSmsResult:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        status:
          type: string
          enum: [sent, not_configured, missing_phone, failed]
        sent:
          type: boolean
        code:
          type: string
          enum: [sms_sent, sms_not_configured, sms_missing_phone, sms_failed]
        message:
          type: string
      required: [routeId, driverId, status, sent, code, message]

    RouteResendSmsError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - route_not_found
            - route_not_active
            - handoff_missing
            - handoff_stale
            - recipient_mismatch
            - recipient_unavailable
            - resend_rate_limited
            - internal_error
      required: [error, code]

    RouteAcknowledgementStatus:
      type: string
      enum: [sent, delivered_to_app, opened, accepted, rejected]

    RouteAcknowledgement:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RouteAcknowledgementStatus"
        sentAt:
          type: string
          format: date-time
        deliveredToAppAt:
          type: ["string", "null"]
          format: date-time
        openedAt:
          type: ["string", "null"]
          format: date-time
        acceptedAt:
          type: ["string", "null"]
          format: date-time
        rejectedAt:
          type: ["string", "null"]
          format: date-time
        rejectionReason:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - routeId
        - driverId
        - organizationId
        - status
        - sentAt
        - deliveredToAppAt
        - openedAt
        - acceptedAt
        - rejectedAt
        - rejectionReason
        - updatedAt

    PlanningInputs:
      type: object
      additionalProperties: false
      required:
        [
          version,
          objective,
          travelReservePercent,
          stopReserveMin,
          stopPriorities,
          excludedPairValues,
          depotOverride,
          vehicleSelectionMode,
        ]
      properties:
        version:
          type: integer
          enum: [1]
        objective:
          type: string
          enum: [balanced, shortest, geographic, areas_worktime, minimize_vehicles]
          description: areas_worktime prioritizes coverage within shifts, then geographic neighborhood separation, then balanced driving plus service time, with road distance as a tie-breaker. Whole-plan multi-vehicle repartition is required to change areas; route-only sequencing cannot repartition stops. No zero-crossing guarantee.
        travelReservePercent:
          type: number
          minimum: 0
          maximum: 100
        stopReserveMin:
          type: integer
          minimum: 0
          maximum: 120
        stopPriorities:
          type: object
          additionalProperties:
            type: integer
            enum: [0, 1, 2]
        excludedPairValues:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: "^[0-9a-fA-F-]{36}:[0-9a-fA-F-]{36}$"
        depotOverride:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [scope, verifiedDepotId]
              properties:
                scope: { type: string, enum: [plan, pair] }
                vehicleId: { type: string, format: uuid }
                verifiedDepotId:
                  type: string
                  description: organization-default or route:{UUID}, where the latter reuses an immutable provider-verified route depot snapshot.
                  pattern: "^(organization-default|route:[0-9a-fA-F-]{36})$"
        vehicleSelectionMode:
          type: string
          enum: [use_all_selected_pairs, minimize_vehicles]
        maxDriverOvertimeMin:
          type: integer
          minimum: 0
          maximum: 1440
        allowLateStopsMin:
          type: integer
          minimum: 0
          maximum: 1440

    PlanningSummary:
      type: object
      required:
        [
          complete,
          objective,
          travelReservePercent,
          stopReserveMin,
          mandatoryUnplannedStopIds,
          selectedPairValues,
          usedPairValues,
          unusedPairValues,
          unplanned,
        ]
      properties:
        complete: { type: boolean }
        objective:
          {
            type: string,
            enum: [balanced, shortest, geographic, areas_worktime, minimize_vehicles],
          }
        travelReservePercent: { type: number }
        stopReserveMin: { type: integer }
        mandatoryUnplannedStopIds:
          type: array
          items: { type: string, format: uuid }
        selectedPairValues:
          type: array
          items: { type: string }
        usedPairValues:
          type: array
          items: { type: string }
        unusedPairValues:
          type: array
          items:
            type: object
            required: [pairValue, reason]
            properties:
              pairValue: { type: string }
              reason: { type: string }
        unplanned:
          type: array
          items:
            type: object
            required: [stopId, priority, reason]
            properties:
              stopId: { type: string, format: uuid }
              priority: { type: integer, enum: [0, 1, 2] }
              reason: { type: string }
        optimizationEvidence:
          oneOf:
            - $ref: "#/components/schemas/OptimizationEvidence"
            - type: "null"

    OptimizationEvidence:
      type: object
      description: Requested and effective optimizer configuration for this plan revision. Null fields mean the historical configuration was not persisted.
      additionalProperties: false
      required:
        [
          source,
          requestedObjective,
          effectiveObjective,
          requestedWeights,
          effectiveWeights,
          vehicleDistributionMode,
          vehicleSelectionMode,
        ]
      properties:
        source:
          type: string
          enum: [planningInputs, legacy, unknown]
        requestedObjective:
          type: ["string", "null"]
          enum: [balanced, shortest, geographic, areas_worktime, minimize_vehicles, null]
        effectiveObjective:
          type: ["string", "null"]
          enum: [balanced, shortest, geographic, areas_worktime, minimize_vehicles, null]
        requestedWeights:
          oneOf:
            - $ref: "#/components/schemas/OptimizationWeightsSnapshot"
            - type: "null"
        effectiveWeights:
          oneOf:
            - $ref: "#/components/schemas/OptimizationWeightsSnapshot"
            - type: "null"
        vehicleDistributionMode:
          type: ["string", "null"]
          enum: [balance, minimize, null]
        vehicleSelectionMode:
          type: ["string", "null"]
          enum: [use_all_selected_pairs, minimize_vehicles, null]

    PlanningInputsReoptimizationInput:
      type: object
      additionalProperties: false
      required: [draftId, draftRevision, planningInputs]
      properties:
        draftId: { type: string, format: uuid }
        draftRevision: { type: integer, minimum: 0 }
        planningInputs: { $ref: "#/components/schemas/PlanningInputs" }
        sharedInstructions: { type: ["string", "null"], maxLength: 4000 }

    PlanningInputsReoptimizationResult:
      type: object
      required: [planId, draftRevision, routes, planningSummary]
      properties:
        planId: { type: string, format: uuid }
        draftRevision: { type: integer, minimum: 0 }
        routes:
          type: array
          items: { $ref: "#/components/schemas/PlanningRouteRevision" }
        planningSummary: { $ref: "#/components/schemas/PlanningSummary" }

    PlanningRouteRevision:
      type: object
      required: [routeId, planRevision, status]
      properties:
        routeId: { type: string, format: uuid }
        planRevision: { type: integer, minimum: 0 }
        status:
          {
            type: string,
            enum: [draft, optimized, in_progress, completed, cancelled],
          }

    PlanningSummaryResponse:
      type: object
      required:
        [
          planId,
          draftId,
          customerReference,
          sharedInstructions,
          planningInputs,
          planningSummary,
          routes,
        ]
      properties:
        planId: { type: string, format: uuid }
        draftId: { type: ["string", "null"], format: uuid }
        customerReference: { type: ["string", "null"] }
        sharedInstructions: { type: ["string", "null"] }
        planningInputs:
          oneOf:
            - $ref: "#/components/schemas/PlanningInputs"
            - type: "null"
        planningSummary:
          oneOf:
            - $ref: "#/components/schemas/PlanningSummary"
            - type: "null"
        routes:
          type: array
          items: { $ref: "#/components/schemas/ImportRoutePlanApprovalSummary" }

    ImportRoutePlanPair:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
      required: [vehicleId, driverId]

    ImportRoutePlanInput:
      type: object
      properties:
        progressId:
          type: string
          format: uuid
          nullable: true
          description: Optional client-generated id used to poll durable import progress.
        draftId:
          type: string
          format: uuid
          nullable: true
