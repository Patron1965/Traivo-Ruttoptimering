openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Traivo Route API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: district
    description: Isolated district planning
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and account recovery
  - name: vehicles
    description: Vehicle management
  - name: stops
    description: Stop management
  - name: routes
    description: Route management
  - name: dashboard
    description: Dashboard statistics
  - name: optimize
    description: Route optimization
  - name: sustainability
    description: CO2 and sustainability
  - name: ai
    description: AI chat assistant
  - name: insights
    description: Proactive AI fleet insights
  - name: drivers
    description: Driver management
  - name: tracking
    description: Vehicle tracking and geofencing
  - name: notifications
    description: In-app notifications
  - name: field-service
    description: Field service execution and billing
  - name: siths
    description: Isolated SITHS healthcare authentication proof-of-concept
  - name: branding
    description: Organization web branding and safe logo staging
  - name: planning
    description: Named route-planning drafts and explicit planner approvals
  - name: customers
    description: Tenant-scoped customer sites and reusable visit planning
  - name: platform
    description: Platform administrator only
paths:
  /org/report-categories:
    get:
      operationId: getReportCategories
      tags: [organizations]
      responses:
        "200":
          description: Organization-specific reporting categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCategoryConfiguration" }
    put:
      operationId: updateReportCategories
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCategoryConfiguration" }
      responses:
        "200":
          description: Updated configuration. Admin only; existing categories can be deactivated, not removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCategoryConfiguration" }
        "409":
          description: Configuration revision changed; reload before saving.
  /portal/login:
    post:
      operationId: portalLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalCredentials" }
      responses:
        "200":
          description: Signed in with a separate customer-only cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIdentity" }
  /portal/access:
    post:
      operationId: portalAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalAccessToken" }
      responses:
        "200":
          description: Single-use email link exchanged for a customer-only session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIdentity" }
        "401": { description: "Invalid, expired or consumed link" }
  /portal/logout:
    post:
      operationId: portalLogout
      responses:
        "204": { description: Signed out }
  /portal/recover:
    post:
      operationId: portalRecover
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalEmail" }
      responses:
        "202": { description: Accepted without disclosing account existence }
  /portal/reset:
    post:
      operationId: portalReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalPassword" }
      responses:
        "204": { description: Password set and existing sessions revoked }
  /portal/me:
    get:
      operationId: getPortalIdentity
      responses:
        "200":
          description: Current customer account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIdentity" }
  /portal/orders:
    get:
      operationId: getPortalOrders
      description: Newest-created orders first, using an opaque chronological cursor with an ID tie-breaker. Reuse asOf across pages. Filters apply to approved outgoing values before counting and paging.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 100 } }
        - { name: asOf, in: query, schema: { type: string, maxLength: 30 } }
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: to, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [scheduled, started, paused, completed, failed, skipped, cancelled, unavailable] } }
      responses:
        "200":
          description: All explicitly permitted orders, no silent truncation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalOrderPage" }
  /portal/orders/active:
    get:
      operationId: getPortalActiveOrders
      description: Actually started orders, newest-created first, using the same opaque chronological cursor as history. Refresh independently of history.
      responses:
        "200":
          description: Started deliveries, independently refreshed and paginated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalOrderPage" }
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 100 } }
  /portal/orders/{id}:
    get:
      operationId: getPortalOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized order and privacy-limited tracking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalOrderDetail" }
  /portal-admin/accounts:
    get:
      operationId: getPortalAccounts
      responses:
        "200":
          description: Organization admin only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PortalAccount" } }
    post:
      operationId: createPortalAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalAccountInput" }
      responses:
        "201":
          description: Pending account created without sending email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAccount" }
  /portal-admin/accounts/{id}:
    put:
      operationId: updatePortalAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalAccountInput" }
      responses:
        "200":
          description: Updated, all previous sessions and reset tokens revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAccount" }
  /portal-admin/accounts/{id}/invite:
    post:
      operationId: invitePortalAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Invitation accepted by email provider, not proof of delivery" }
  /portal-admin/contacts:
    get:
      operationId: getPortalContacts
      responses:
        "200":
          description: Explicitly approved resource work contacts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PortalContact" } }
  /portal-admin/contacts/{vehicleId}:
    put:
      operationId: updatePortalContact
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalContactInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalContact" }
  /organizations/{id}/customer-notifications/{attemptId}/recover:
    post:
      operationId: recoverCustomerNotification
      tags: [Settings]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, recipient]
              properties:
                revision: { type: integer, minimum: 0 }
                recipient: { type: string, minLength: 3, maxLength: 254 }
      responses:
        "200":
          description: Recovery processed; refresh attempts for submission outcome, not delivery confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [processed]
                properties:
                  processed: { type: boolean }
        "400": { description: Invalid recipient or request }
        "403": { description: Administrator access required }
        "404": { description: Organization or attempt not found }
        "409": { description: "Stale, unsafe, disabled or no longer relevant attempt" }
  /organizations/{id}/settings:
    get:
      operationId: getOrganizationNotificationSettings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Organization settings, admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerNotificationSettingsResponse" }
        "403": { description: Admin access required }
        "404": { description: Organization not found }
    put:
      operationId: updateOrganizationNotificationSettings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerNotificationSettingsInput" }
      responses:
        "200":
          description: Saved without sending any notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerNotificationSettingsResponse" }
        "400": { description: Invalid templates }
        "403": { description: Admin access required }
        "404": { description: Organization not found }
  /send-sms:
    post:
      operationId: sendSms
      tags: [notifications]
      summary: Send an SMS through LINK Mobility (administrator only)
      description: Acceptance is not proof of handset delivery. No automatic retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, destination, userData]
              properties:
                source:
                  type: string
                  pattern: '^[A-Za-z0-9]{1,11}$'
                  description: Approved alphanumeric sender containing at least one letter.
                destination:
                  type: string
                  pattern: '^\+467[0-9]{8}$'
                userData:
                  type: string
                  minLength: 1
                  maxLength: 459
      responses:
        "202":
          description: Accepted by provider; delivery is not yet confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        "400":
          description: Invalid SMS payload.
        "401":
          description: Authentication required.
        "403":
          description: Administrator required.
        "429":
          description: SMS rate limit exceeded.
        "502":
          description: Provider rejected the request or outcome is unknown; do not retry blindly.
        "503":
          description: LINK credentials are missing.
  /organization/capabilities:
    get:
      operationId: getOrganizationCapabilities
      tags: [auth]
      summary: Authenticated organization's module access
      description: Uses only the session organization. Districts require explicit superuser assignment.
      responses:
        "200":
          description: Own organization capabilities
          content:
            application/json:
              schema:
                type: object
                required: [districtEnabled]
                properties:
                  districtEnabled:
                    type: boolean
        "401":
          description: Authentication required
        "503":
          description: Policy unavailable; access must fail closed
  /routes/{id}/import-stops/preview:
    post:
      operationId: previewRouteAppendImport
      tags: [Routes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRouteAppendImportBody"
      responses:
        "200":
          description: Durable proposal only; no route or stop mutations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewRouteAppendImportResponse"
        "409":
          description: Route revision or lifecycle conflict.
        "422":
          description: Invalid rows or infeasible route.
  /routes/{id}/import-stops/apply:
    post:
      operationId: applyRouteAppendImport
      tags: [Routes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRouteAppendImportBody"
      responses:
        "200":
          description: Exact proposal appended and reordered atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyRouteAppendImportResponse"
        "409":
          description: Expired or stale proposal, changed planning inputs, or duplicates not acknowledged.
  /district-intake/sources:
    get:
      operationId: listDistrictIntakeSources
      tags: [district]
      responses:
        '200':
          description: Writer-only tenant draft metadata
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/DistrictIntakeSource' }
  /district-plans/{planId}/intake:
    parameters:
      - { $ref: '#/components/parameters/DistrictPlanId' }
    get:
      operationId: getDistrictIntake
      tags: [district]
      responses:
        '200':
          description: Complete conserved intake, writer access only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictIntakeEnvelope' }
    post:
      operationId: createDistrictIntake
      tags: [district]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictIntakeInput' }
      responses:
        '200':
          description: Created or idempotently reused intake
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictIntakeEnvelope' }
  /district-plans/{planId}/intake/from-draft:
    parameters:
      - { $ref: '#/components/parameters/DistrictPlanId' }
    post:
      operationId: transferDistrictIntake
      tags: [district]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictIntakeTransferInput' }
      responses:
        '200':
          description: Copied source rows without operational mutations or geocoding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictIntakeEnvelope' }
  /district-plans/{planId}/intake/rows/{sourceRowNumber}/search:
    parameters:
      - { $ref: '#/components/parameters/DistrictPlanId' }
      - name: sourceRowNumber
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: searchDistrictIntakeAddress
      tags: [district]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictIntakeSearchInput' }
      responses:
        '200':
          description: Explicit single-row geocoding; candidates require acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictIntakeEnvelope' }
  /district-plans/{planId}/intake/rows/{sourceRowNumber}/accept:
    parameters:
      - { $ref: '#/components/parameters/DistrictPlanId' }
      - name: sourceRowNumber
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: acceptDistrictIntakeAddress
      tags: [district]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictIntakeAcceptInput' }
      responses:
        '200':
          description: Explicit accepted candidate promoted to district point
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictIntakeEnvelope' }
  /district-plans:
    get:
      operationId: listDistrictPlans
      tags: [district]
      responses:
        '200':
          description: Tenant plans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictPlanList' }
    post:
      operationId: createDistrictPlan
      tags: [district]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictPlanInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictPlan' }
  /district-plans/{planId}:
    get:
      operationId: getDistrictPlan
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
      responses:
        '200':
          description: Plan and histories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictDetail' }
  /district-plans/{planId}/imports/preview:
    post:
      operationId: previewDistrictImport
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictImportInput' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictImportPreview' }
  /district-plans/{planId}/imports:
    post:
      operationId: importDistrictPoints
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictImportCommit' }
      responses:
        '201':
          description: Imported (or idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictImport' }
  /district-plans/{planId}/points:
    get:
      operationId: listDistrictPoints
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 6000, default: 1000 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictPointList' }
  /district-plans/{planId}/zones:
    post:
      operationId: createDistrictZone
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictZoneInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictZone' }
  /district-plans/{planId}/zones/{zoneId}:
    put:
      operationId: updateDistrictZone
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - { $ref: '#/components/parameters/DistrictZoneId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictZoneUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictZone' }
    delete:
      operationId: deleteDistrictZone
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - { $ref: '#/components/parameters/DistrictZoneId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictZoneDelete' }
      responses:
        '204': { description: Soft deleted }
  /district-plans/{planId}/zones/{zoneId}/bulk-preview:
    post:
      operationId: previewDistrictBulk
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - { $ref: '#/components/parameters/DistrictZoneId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictJobInput' }
      responses:
        '200':
          description: Explicit capacity and position check; does not enqueue a job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictBulkPreview' }
        '403': { description: Organization or role not permitted }
        '409': { description: Dataset revision changed }
        '422': { description: Invalid endpoints or scope }
        '503': { description: Approved bulk provider unavailable }
  /district-plans/{planId}/zones/{zoneId}/jobs:
    post:
      operationId: startDistrictJob
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - { $ref: '#/components/parameters/DistrictZoneId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictJobInput' }
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictJob' }
  /district-plans/{planId}/jobs/{jobId}:
    get:
      operationId: getDistrictJob
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - { $ref: '#/components/parameters/DistrictJobId' }
      responses:
        '200':
          description: Job status and result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictJobDetail' }
  /district-plans/{planId}/jobs/{jobId}/cancel:
    post:
      operationId: cancelDistrictJob
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - { $ref: '#/components/parameters/DistrictJobId' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictJobEnvelope' }
  /district-plans/{planId}/jobs/{jobId}/exports:
    post:
      operationId: createDistrictExport
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - { $ref: '#/components/parameters/DistrictJobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistrictExportInput' }
      responses:
        '201':
          description: Immutable snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictExportEnvelope' }
  /district-plans/{planId}/exports:
    get:
      operationId: listDistrictExports
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
      responses:
        '200':
          description: Export history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictExportList' }
  /district-plans/{planId}/exports/{exportId}/file:
    get:
      operationId: downloadDistrictExport
      tags: [district]
      parameters:
        - { $ref: '#/components/parameters/DistrictPlanId' }
        - in: path
          name: exportId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [csv, xlsx] }
      responses:
        '200':
          description: Regenerated CSV or XLSX
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /platform/workspace:
    post:
      operationId: enterPlatformWorkspace
      tags: [platform]
      description: Issue one hour operational authority for an active Superuser session. Revokes that session's previous workspace. Send the returned token as X-Traivo-Workspace on EVERY tenant request (including auth/me, exports and private downloads); never replay requests on switch. WebSockets pin it in the workspace.TOKEN subprotocol. Permanent user membership and login identity do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        '201':
          description: Session-bound operational context. No-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceGrant"
        '403':
          description: Not Superuser or invalid operational context.
        '404':
          description: Company does not exist.
    delete:
      operationId: leavePlatformWorkspace
      tags: [platform]
      parameters:
        - in: header
          name: X-Traivo-Workspace
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authority revoked across instances. Client must discard tenant state.
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: boolean }
        '403':
          description: Invalid or expired context; no fallback to home organization.
  /auth/me:
    get:
      operationId: getAuthenticatedSession
      tags: [auth]
      description: Returns effective organization and admin role only for a verified X-Traivo-Workspace context. id and email always identify the authenticating actor. An invalid supplied context fails closed.
      parameters:
        - in: header
          name: X-Traivo-Workspace
          schema: { type: string }
      responses:
        '200':
          description: Effective identity and original session metadata.
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user:
                    type: object
                    additionalProperties: true
                    properties:
                      id: { type: string }
                      email: { type: string }
                      organizationId: { type: string }
                      homeOrganizationId: { type: string }
                      workspace: { $ref: "#/components/schemas/WorkspaceContext" }
                  session:
                    type: object
                    additionalProperties: true
        '401':
          description: Authentication required.
        '403':
          description: Workspace invalid.
  /auth/mfa/operator-recovery:
    post:
      operationId: redeemPlatformMfaOperatorRecovery
      tags: [auth]
      description: Redeem an offline operator-issued single-use grant with the account password. Creates a restricted session and sends an email verification code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, recoveryToken]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 1024 }
                recoveryToken: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Restricted cookie set; no ordinary API access until email code verification.
          content:
            application/json:
              schema:
                type: object
                required: [mfaRequired, enrollmentRequired]
                properties:
                  mfaRequired: { type: boolean }
                  enrollmentRequired: { type: boolean }
        '401':
          description: Invalid credentials or grant.
        '429':
          description: Too many attempts.
        '503':
          description: Operator recovery policy is disabled or unavailable.
  /auth/mfa/status:
    get:
      operationId: getPlatformMfaStatus
      tags: [auth]
      description: Returns status of a pending password-authenticated Traivo Superuser session.
      responses:
        '200':
          description: Pending MFA challenge status.
          content:
            application/json:
              schema:
                type: object
                required: [mfaRequired, enrollmentRequired]
                properties:
                  mfaRequired: { type: boolean }
                  enrollmentRequired: { type: boolean }
        '401':
          description: No valid pending challenge.
  /auth/mfa/enroll:
    post:
      operationId: enrollPlatformMfa
      tags: [auth]
      description: Retired authenticator enrollment endpoint. Superuser verification now uses email codes.
      responses:
        '410':
          description: Authenticator enrollment is no longer available.
  /auth/mfa/resend:
    post:
      operationId: resendPlatformEmailCode
      tags: [auth]
      description: Send a new session-bound email code after password authentication. At most one send per account per minute; failed attempts are not reset.
      responses:
        '204':
          description: Provider accepted the email; this is not proof of mailbox delivery.
        '401':
          description: Pending session is missing, expired, revoked or locked.
        '429':
          description: Wait before requesting another code.
        '503':
          description: Email could not be sent.
  /auth/mfa/verify:
    post:
      operationId: verifyPlatformMfa
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Single-use email code verified.
          content:
            application/json:
              schema:
                type: object
                required: [user, token, session]
                properties:
                  token: { type: string }
                  user:
                    type: object
                    additionalProperties: true
                  session:
                    type: object
                    additionalProperties: true
        '401':
          description: Invalid, expired, or replayed challenge.
  /auth/driver-link:
    post:
      operationId: redeemDriverLink
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200':
          description: Single-use link exchanged for a driver-only device session.
          content:
            application/json:
              schema:
                type: object
                required: [token, routeId, user, session]
                properties:
                  token: { type: string }
                  routeId: { type: string }
                  user: { type: object, additionalProperties: true }
                  session: { type: object, additionalProperties: true }
        '401':
          description: Invalid, expired or revoked link.
        '429':
          description: Too many activation attempts.
  /drivers/{id}/revoke-access:
    post:
      operationId: revokeDriverMobileAccess
      tags: [drivers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Driver device sessions and outstanding links revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        '403':
          description: Only administrators and dispatchers may revoke access.
  /platform/support-access:
    post:
      operationId: openPlatformSupportAccess
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportAccessInput'
      responses:
        '201':
          description: Session-bound read-only summary grant, expires after 15 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccessGrant'
  /platform/support-access/current:
    parameters:
      - in: header
        name: X-Support-Access
        required: true
        schema:
          type: string
    get:
      operationId: getPlatformSupportSummary
      tags: [Platform]
      responses:
        '200':
          description: Audited isolated summary; no operational data or exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSummary'
    delete:
      operationId: closePlatformSupportAccess
      tags: [Platform]
      responses:
        '200':
          description: Grant revoked.
  /platform/security-events:
    get:
      operationId: listPlatformSecurityEvents
      tags: [platform]
      description: Recent platform-only audit events. Raw event metadata and credentials are excluded.
      responses:
        "200":
          description: Most recent 100 platform events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, createdAt, action]
                      properties:
                        id: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
                        action: { type: string }
                        organizationId: { type: [string, "null"], format: uuid }
                        userEmail: { type: [string, "null"] }
                        resourceType: { type: [string, "null"] }
                        statusCode: { type: [string, "null"] }
        "403": { description: Traivo Superuser required }
  /platform/cuopt/status:
    get:
      operationId: getPlatformCuoptStatus
      tags: [platform]
      description: Server-side configuration presence only; does not contact NVIDIA.
      responses:
        "200":
          description: Configuration presence, not connectivity
          content:
            application/json:
