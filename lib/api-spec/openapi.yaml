          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ImportPlanResourceRevision"
        pairs:
          type: array
          minItems: 1
          maxItems: 50
          description: Active, unique vehicle-driver pairs to use. Omit to retain the existing resources.
          items:
            $ref: "#/components/schemas/ImportRoutePlanPair"
        depotLatitude:
          type: number
          minimum: -90
          maximum: 90
        depotLongitude:
          type: number
          minimum: -180
          maximum: 180
      required:
        - serviceDurationMin
        - serviceTimeStrategy
        - routes
        - depotLatitude
        - depotLongitude

