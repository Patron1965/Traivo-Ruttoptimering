        - depotLongitude
        - proposalHash

    WholePlanReoptimizationMetrics:
      type: object
      additionalProperties: false
      properties:
        stopCount: { type: integer, minimum: 0 }
        distanceKm: { type: ["number", "null"], minimum: 0 }
        durationMin: { type: ["number", "null"], minimum: 0 }
      required: [stopCount, distanceKm, durationMin]

    WholePlanReoptimizationRoute:
      type: object
      additionalProperties: false
      properties:
        routeId: { type: ["string", "null"], format: uuid }
        vehicleId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        planRevision: { type: integer, minimum: 0 }
        nextPlanRevision: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [draft, optimized, in_progress, completed, cancelled]
        lockedStopIds:
          type: array
          items: { type: string, format: uuid }
        pendingStopIds:
          type: array
          items: { type: string, format: uuid }
        optimizedStopIds:
          type: array
          items: { type: string, format: uuid }
        movedStopCount: { type: integer, minimum: 0 }
        before: { $ref: "#/components/schemas/WholePlanReoptimizationMetrics" }
        after: { $ref: "#/components/schemas/WholePlanReoptimizationMetrics" }
      required:
        - routeId
        - vehicleId
        - driverId
        - planRevision
        - nextPlanRevision
        - status
        - lockedStopIds
        - pendingStopIds
        - optimizedStopIds
        - movedStopCount
        - before
        - after

    WholePlanReoptimizationResult:
      type: object
      additionalProperties: false
      properties:
        planId: { type: string, format: uuid }
        draftId: { type: ["string", "null"], format: uuid }
        draftRevision: { type: ["integer", "null"], minimum: 0 }
        proposalHash: { type: string, minLength: 64, maxLength: 64 }
        lockedStopCount: { type: integer, minimum: 0 }
        movedStopCount: { type: integer, minimum: 0 }
        routes:
          type: array
          items:
            $ref: "#/components/schemas/WholePlanReoptimizationRoute"
      required:
        - planId
        - draftId
        - draftRevision
        - proposalHash
        - lockedStopCount
        - movedStopCount
        - routes

    OptimizeRequest:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        vehicleIds:
          type: array
          items:
            type: string
            format: uuid
        stopIds:
          type: array
          items:
            type: string
            format: uuid
        depotLatitude:
          type: number
        depotLongitude:
          type: number
        timeBudgetMs:
          type: number
          minimum: 1000
          maximum: 120000
        async:
          type: boolean
          description: Run the optimization asynchronously. The web client uses this for large selections so progress can be displayed while the job runs.
        vehicleDistributionMode:
          type: string
          enum: [minimize, balance]
          default: minimize
          description: Minimize active vehicles or balance estimated work time across all selected vehicles.
        optimizationWeights:
          $ref: "#/components/schemas/OptimizationWeights"
        planningInputs:
          $ref: "#/components/schemas/PlanningInputs"
      required:
        - organizationId
        - vehicleIds
        - stopIds
        - depotLatitude
        - depotLongitude

    OptimizationWeightsSnapshot:
      description: Persisted named-profile configuration. The lexicographic selector is derived from planningInputs, not raw custom weights.
      allOf:
        - $ref: "#/components/schemas/OptimizationWeights"
        - type: object
          properties:
            objectivePriority:
              type: string
              enum: [areas_worktime]

    OptimizationWeights:
      type: object
      description: Relative preferences used for feasible route candidates.
      properties:
        distanceWeight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.45
        co2Weight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.25
        etaPrecisionWeight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.15
        driverHappinessWeight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.15
        geographicCohesionWeight:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Prefer keeping customer stops within 10 km on the same active route.

    UnassignedReason:
      type: object
      description: Explains why a specific stop could not be assigned to any vehicle during optimization.
      properties:
        stopId:
          type: string
          format: uuid
        reasonCodes:
          type: array
          description: Machine-readable reason codes (e.g. MISSING_SKILL, EXPIRED_CERTIFICATION, MISSING_EQUIPMENT, CAPACITY_EXCEEDED, NO_ELIGIBLE_VEHICLE).
          items:
            type: string
        details:
          type: array
          description: Human-readable explanation for each reason code.
          items:
            type: string
      required:
        - stopId
        - reasonCodes
        - details

    OptimizeResponse:
      type: object
      properties:
        planId:
          type: string
          format: uuid
        routes:
          type: array
          items:
            $ref: "#/components/schemas/OptimizedRoute"
        totalDistanceKm:
          type: number
        totalDurationMin:
          type: number
        unassignedStopIds:
          type: array
          items:
            type: string
            format: uuid
        unassignedReasons:
          type: array
          description: Per-stop explanations for why each unassigned stop could not be routed. Present when at least one stop is unassigned; entries correspond to unassignedStopIds by index.
          items:
            $ref: "#/components/schemas/UnassignedReason"
        optimizationTiming:
          $ref: "#/components/schemas/OptimizationTiming"
        optimizationEvidence:
          $ref: "#/components/schemas/OptimizationEvidence"
      required:
        - planId
        - routes
        - totalDistanceKm
        - totalDurationMin
        - unassignedStopIds

    OptimizationSubmissionResponse:
      oneOf:
        - $ref: "#/components/schemas/OptimizeResponse"
        - $ref: "#/components/schemas/OptimizationJobAccepted"

    OptimizationJobAccepted:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - running
        stopCount:
          type: integer
        vehicleCount:
          type: integer
      required:
        - jobId
        - status
        - stopCount
        - vehicleCount

    OptimizationJobProgress:
      type: object
      description: Live telemetry emitted for an asynchronous large optimization job.
      properties:
        totalClusters:
          type: integer
        completedClusters:
          type: integer
        phase:
          type: string
          enum:
            - preparing
            - distance_matrix
            - clustering
            - optimizing
            - merging
            - complete
        elapsedMs:
          type: integer
        iterations:
          type: integer
        improvements:
          type: integer
        stopReason:
          type:
            - string
            - "null"
          enum:
            - time_limit
            - max_iterations
            - no_improvement
            - no_nodes
            - no_vehicles
            - mixed
            - null
          description: Aggregate reason completed clusters stopped, when available.
        clusterStopReasons:
          type: object
          additionalProperties:
            type: integer
      required:
        - totalClusters
        - completedClusters
        - phase
        - elapsedMs
        - iterations
        - improvements
        - stopReason
        - clusterStopReasons

    OptimizationJobStatus:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - running
            - complete
            - error
        progress:
          oneOf:
            - $ref: "#/components/schemas/OptimizationJobProgress"
            - type: "null"
        stopCount:
          type: integer
        vehicleCount:
          type: integer
        result:
          $ref: "#/components/schemas/OptimizeResponse"
        error:
          type:
            - string
            - "null"
        elapsedMs:
          type: integer
      required:
        - jobId
        - status
        - progress
        - stopCount
        - vehicleCount
        - error
        - elapsedMs

    OptimizationTiming:
      type: object
      description: Completed optimization time distribution and search summary, used to explain large-job wait time.
      properties:
        inputLoadMs:
          type: integer
        weatherMs:
          type: integer
        distanceMatrixMs:
          type: integer
        clusteringMs:
          type: integer
        alnsSearchMs:
          type: integer
        mergingMs:
          type: integer
        searchMs:
          type: integer
        persistenceMs:
          type: integer
        totalMs:
          type: integer
        timeBudgetMs:
          type: integer
        profile:
          type: string
          enum:
            - small
            - compact
            - standard
            - custom
        distanceSource:
          type: string
          enum:
            - cache
            - osrm
            - mixed
            - haversine
        iterations:
          type: integer
        improvements:
          type: integer
        localSearchMs:
          type: integer
        stopReason:
          type: string
          enum:
            - time_limit
            - max_iterations
            - no_improvement
            - no_nodes
            - no_vehicles
            - mixed
        totalClusters:
          type: integer
        optimizedClusters:
          type: integer
        clusterStopReasons:
          type: object
          additionalProperties:
            type: integer
      required:
        - inputLoadMs
        - weatherMs
        - distanceMatrixMs
        - clusteringMs
        - alnsSearchMs
        - mergingMs
        - searchMs
        - persistenceMs
        - totalMs
        - timeBudgetMs
        - profile
        - distanceSource
        - iterations
        - improvements
        - localSearchMs
        - stopReason
        - totalClusters
        - optimizedClusters

    OptimizedRoute:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planRevision:
          type: integer
          minimum: 0
        stops:
          type: array
          items:
            $ref: "#/components/schemas/OptimizedStop"
        distanceKm:
          type: number
        durationMin:
          type: number
        co2EmissionsKg:
          type: number
        chargingStopsInserted:
          type: integer
        geographicOverlapExplanation:
          $ref: "#/components/schemas/GeographicOverlapExplanation"
        depotSnapshot:
          oneOf:
            - $ref: "#/components/schemas/RouteDepotSnapshot"
            - type: "null"
        workdayTimeline:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/RouteWorkdayTimelineItem"
        workdaySummary:
          $ref: "#/components/schemas/RouteWorkdaySummary"
      required:
        - vehicleId
        - routeId
        - planId
        - planRevision
        - stops
        - distanceKm
        - durationMin
        - co2EmissionsKg

    GeographicOverlapExplanation:
      type: object
      description: Bounded, version-scoped evidence about evaluated nearby cross-route stop pairs. It never claims an entire area can or cannot be consolidated.
      properties:
        status:
          type: string
          enum: [confirmed, unknown, incomplete]
          description: confirmed only after actual insertions failed in both directions; unknown has no established blocker; incomplete reached the analysis budget.
        reasonCode:
          type: string
          enum:
            - TIME_WINDOW
            - CAPACITY
            - SKILL
            - WORKING_HOURS
            - EV_RANGE
        message:
          type: string
        analyzedPairCount:
          type: integer
          minimum: 1
        scope:
          type: object
