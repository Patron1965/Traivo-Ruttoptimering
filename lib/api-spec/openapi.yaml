  /stops/organization:
    get:
      operationId: listOrganizationStops
      tags: [stops]
      summary: List every organization stop with server-side search, filters, and pagination
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, completed, failed, skipped]
        - name: archiveState
          in: query
          required: false
          description: Administrative history filter. Defaults to active, excluding planning-archived stops.
          schema:
            type: string
            enum: [active, archived, all]
        - name: workStatus
          in: query
          required: false
          description: >
            Work-status group applied before counting and pagination. current is
            pending and in_progress; terminal is completed, failed, and skipped.
          schema:
            type: string
            enum: [current, terminal]
        - name: deletionProtection
          in: query
          required: false
          description: >
            Filter by the server-authoritative deletion policy. protected
            includes status, proof, execution history, and service report
            protection; deletable includes only pending stops with none of
            those protections.
          schema:
            type: string
            enum: [protected, deletable]
        - name: assignment
          in: query
          required: false
          schema:
            type: string
            enum: [assigned, unassigned]
        - name: routeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: orderType
          in: query
          required: false
          schema:
            type: string
            enum: [single_stop, pickup_delivery]
        - name: jobType
          in: query
          required: false
          schema:
            type: string
            enum: [transport, service]
        - name: quality
          in: query
          required: false
          schema:
            type: string
            enum: [ready, issues, geocode_error]
        - name: planning
          in: query
          required: false
          schema:
            type: string
            enum: [planned, unplanned]
        - name: timeWindow
          in: query
          required: false
          schema:
            type: string
            enum: [set, unset]
        - name: requirements
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: tracking
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: dateField
          in: query
          required: false
          schema:
            type: string
            enum: [planned_delivery, imported_created]
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dateToExclusive
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: includeWithoutPlannedDate
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Exact matching count and one page of organization stops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationStopPage"

  /stops/import:
