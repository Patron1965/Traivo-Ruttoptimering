      operationId: initiatePlatformPasswordReset
      tags: [platform]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Reset link delivered to the account email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformDeliveryResult" }
        "503": { description: Delivery unavailable }

  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
