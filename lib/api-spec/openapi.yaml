    DispatchStopMoveInput:
      type: object
      required: [stopIds, routeId, targetIndex, routeRevisions]
      properties:
        newProject:
          $ref: "#/components/schemas/DispatchNewProject"
        optimizeTargetRoute:
          type: boolean
          default: false
          description: Optimize the entire existing recipient route. Requires a reviewed preview digest on commit; never creates routes.
        expectedPreviewDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Exact canonical preview binding. Resource, rule, route or stop changes reject atomically without writes.
        stopIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        routeId:
          type: string
          format: uuid
          nullable: true
        targetIndex:
          type: integer
          minimum: 0
        force:
          type: boolean
          default: false
        routeRevisions:
          type: array
          uniqueItems: true
          description: Compare-and-swap revisions for every affected source and target route.
          items:
            type: object
            required: [routeId, planRevision]
            properties:
              routeId: { type: string, format: uuid }
              planRevision: { type: integer, minimum: 0 }

    DispatchStopMoveResponse:
      type: object
      required: [stops, conflicts]
      properties:
        draftId: { type: string, format: uuid }
        stops:
          type: array
          items:
            $ref: "#/components/schemas/Stop"
        conflicts:
          type: array
          items:
            type: string
            enum: [NO_VEHICLE, CAPACITY, TIME_WINDOW, WORKING_HOURS, RANGE]

    DispatchStopMovePreviewInput:
      type: object
      required: [stopIds, routeId, targetIndex, routeRevisions]
      properties:
        newProject:
          $ref: "#/components/schemas/DispatchNewProject"
        optimizeTargetRoute:
          type: boolean
          default: false
          description: Propose an optimized order for the entire existing recipient route.
        expectedPreviewDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        stopIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        routeId:
          type: string
          format: uuid
          nullable: true
        targetIndex:
          type: integer
          minimum: 0
        force:
          type: boolean
          default: false
        routeRevisions:
          type: array
          minItems: 1
          uniqueItems: true
          description: Compare-and-swap revisions for every affected source and target route.
          items:
            type: object
            required: [routeId, planRevision]
            properties:
              routeId: { type: string, format: uuid }
              planRevision: { type: integer, minimum: 0 }

    DispatchStopMovePreviewResponse:
      type: object
      required: [canMove, conflicts, sourceRouteIds, targetRouteId, targetStopCount, previewDigest, consequences]
      properties:
        previewDigest:
          type: string
          description: Binds exact input (including force), relevant persisted eligibility facts and calculated consequences.
        consequences:
          $ref: "#/components/schemas/DispatchMoveConsequences"
        canMove:
          type: boolean
          description: True when the move can commit with the supplied force setting.
        conflicts:
          description: Soft route conflict codes; non-empty conflicts can still be committed when force is true.
          type: array
          items:
            type: string
            enum: [NO_VEHICLE, CAPACITY, TIME_WINDOW, WORKING_HOURS, RANGE]
        sourceRouteIds:
          description: Sorted distinct source routes that lose selected stops, excluding the target route.
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        targetRouteId:
          description: Existing target route, or null for unassignment to the selected plan queue.
          type: string
          format: uuid
          nullable: true
        targetStopCount:
          description: Number of customer stops on the target route after the prospective move.
          type: integer
          minimum: 0

