          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
        "404":
          description: User or driver profile not found in this organization
        "409":
          description: Driver profile is already linked
    delete:
      operationId: unlinkAppUserDriverProfile
      tags: [auth]
      summary: Unlink a driver profile from an app user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated app user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
        "404":
          description: User not found in this organization

  /export:
    get:
      operationId: exportOrganizationData
      tags: [exports]
      summary: Export organization data or an operational report
      description: >-
        The full organization backup is administrator-only. Stops, routes,
        delivery proof and billing reports are available to administrators and
        dispatchers. CSV proof exports return a ZIP package with its manifest
        and accessible proof files; JSON proof exports return the manifest only.
        Environment reports are generated as PDF. A finished route plan can be
        downloaded as a Swedish XLSX workbook.
      parameters:
        - name: type
          in: query
          required: false
          description: Omit for the full organization export.
          schema:
            type: string
            enum: [stops, routes, routePlan, proofs, billing, environment]
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json, pdf, xlsx]
            default: json
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: A date-only value includes the full calendar day; explicit datetimes are used as-is.
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          description: Comma-separated stop statuses; supported by stop and proof exports.
          schema:
            type: string
        - name: planId
          in: query
          required: false
          description: Limits a routePlan XLSX export to one plan.
          schema:
            type: string
            format: uuid
        - name: routeId
          in: query
          required: false
          description: Limits a routePlan XLSX export to one route.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A CSV, JSON, or ZIP download depending on export type and format.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
            application/zip:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /healthz:
