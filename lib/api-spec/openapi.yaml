openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RouteAI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vehicles
    description: Vehicle management
  - name: stops
    description: Stop management
  - name: routes
    description: Route management
  - name: dashboard
    description: Dashboard statistics
  - name: optimize
    description: Route optimization
  - name: sustainability
    description: CO2 and sustainability
  - name: ai
    description: AI chat assistant
  - name: insights
    description: Proactive AI fleet insights
  - name: drivers
    description: Driver management
  - name: tracking
    description: Vehicle tracking and geofencing
  - name: notifications
    description: In-app notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List all vehicles
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleBody"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    put:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleBody"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /stops:
    get:
      operationId: listStops
      tags: [stops]
      summary: List all stops
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: routeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stop"
    post:
      operationId: createStop
      tags: [stops]
      summary: Create a stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStopBody"
      responses:
        "201":
          description: Created stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"

  /stops/import:
    post:
      operationId: importStops
      tags: [stops]
      summary: Bulk import stops from CSV data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportStopsBody"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportStopsResponse"

  /stops/{id}:
    get:
      operationId: getStop
      tags: [stops]
      summary: Get a stop by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stop details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"
        "404":
          description: Not found
    put:
      operationId: updateStop
      tags: [stops]
      summary: Update a stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStopBody"
      responses:
        "200":
          description: Updated stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"
        "404":
          description: Not found
    delete:
      operationId: deleteStop
      tags: [stops]
      summary: Delete a stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /stops/{id}/proof:
    post:
      operationId: submitProof
      tags: [stops]
      summary: Submit proof of delivery for a stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProofBody"
      responses:
        "201":
          description: Created proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryProof"
        "400":
          description: Invalid request
        "404":
          description: Stop not found

  /stops/{id}/proofs:
    get:
      operationId: getStopProofs
      tags: [stops]
      summary: Get all proofs of delivery for a stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of proofs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryProof"

  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List all routes
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, optimized, in_progress, completed, cancelled]
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteBody"
      responses:
        "201":
          description: Created route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Route details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    put:
      operationId: updateRoute
      tags: [routes]
      summary: Update a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteBody"
      responses:
        "200":
          description: Updated route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Not found
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Delete a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /routes/{id}/stops:
    get:
      operationId: getRouteStops
      tags: [routes]
      summary: Get stops for a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of stops for the route
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stop"

  /routes/{id}/export:
    get:
      operationId: exportRoute
      tags: [routes]
      summary: Export route as CSV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /optimize:
    post:
      operationId: optimizeRoutes
      tags: [optimize]
      summary: Optimize route assignments and ordering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
      responses:
        "200":
          description: Optimized routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /sustainability/stats:
    get:
      operationId: getSustainabilityStats
      tags: [sustainability]
      summary: Get CO2 and sustainability statistics
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sustainability statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SustainabilityStats"

  /insights:
    get:
      operationId: getInsights
      tags: [insights]
      summary: Get proactive AI fleet insights
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: enhance
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
            default: "true"
      responses:
        "200":
          description: Fleet insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: AI chat assistant with fleet context (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: SSE stream of AI response chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      summary: List all drivers
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"
    post:
      operationId: createDriver
      tags: [drivers]
      summary: Create a driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriverBody"
      responses:
        "201":
          description: Created driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

  /drivers/{id}:
    get:
      operationId: getDriver
      tags: [drivers]
      summary: Get a driver by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Driver details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "404":
          description: Not found
    put:
      operationId: updateDriver
      tags: [drivers]
      summary: Update a driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDriverBody"
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "404":
          description: Not found
    delete:
      operationId: deleteDriver
      tags: [drivers]
      summary: Delete a driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /vehicles/positions:
    get:
      operationId: getVehiclePositions
      tags: [tracking]
      summary: Get simulated real-time vehicle positions
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of vehicle positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehiclePosition"

  /geofence/events:
    get:
      operationId: getGeofenceEvents
      tags: [tracking]
      summary: Get recent geofence events
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of geofence events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeofenceEvent"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notifications with unread count
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Notifications with unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"

  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found

  /notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /track/{code}:
    get:
      operationId: trackDelivery
      tags: [tracking]
      summary: Public delivery tracking by code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingInfo"
        "404":
          description: Tracking code not found

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        licensePlate:
          type: string
        vehicleType:
          type: string
          enum: [fossil, electric]
        capacityKg:
          type: number
        capacityVolume:
          type: number
        batteryCapacityKwh:
          type: number
          nullable: true
        currentBatteryPercent:
          type: number
          nullable: true
        rangeKm:
          type: number
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - name
        - licensePlate
        - vehicleType
        - capacityKg
        - capacityVolume
        - isActive
        - createdAt

    CreateVehicleBody:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        licensePlate:
          type: string
        vehicleType:
          type: string
          enum: [fossil, electric]
        capacityKg:
          type: number
        capacityVolume:
          type: number
        batteryCapacityKwh:
          type: number
          nullable: true
        currentBatteryPercent:
          type: number
          nullable: true
        rangeKm:
          type: number
          nullable: true
      required:
        - organizationId
        - name
        - licensePlate
        - vehicleType
        - capacityKg
        - capacityVolume

    UpdateVehicleBody:
      type: object
      properties:
        name:
          type: string
        licensePlate:
          type: string
        vehicleType:
          type: string
          enum: [fossil, electric]
        capacityKg:
          type: number
        capacityVolume:
          type: number
        batteryCapacityKwh:
          type: number
          nullable: true
        currentBatteryPercent:
          type: number
          nullable: true
        rangeKm:
          type: number
          nullable: true
        isActive:
          type: boolean

    Stop:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timeWindowStart:
          type: string
          format: date-time
          nullable: true
        timeWindowEnd:
          type: string
          format: date-time
          nullable: true
        serviceDurationMin:
          type: integer
        weightKg:
          type: number
          nullable: true
        volumeM3:
          type: number
          nullable: true
        status:
          type: string
          enum: [pending, in_progress, completed, failed, skipped]
        sequenceOrder:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        trackingCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - address
        - latitude
        - longitude
        - serviceDurationMin
        - status
        - createdAt

    DeliveryProof:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stopId:
          type: string
          format: uuid
        proofType:
          type: string
          enum: [photo, signature, barcode]
        fileUrl:
          type: string
          nullable: true
        data:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - stopId
        - proofType
        - capturedAt
        - createdAt

    SubmitProofBody:
      type: object
      properties:
        proofType:
          type: string
          enum: [photo, signature, barcode]
        data:
          type: string
          description: Base64 data for photo/signature, text value for barcode
        notes:
          type: string
      required:
        - proofType

    CreateStopBody:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timeWindowStart:
          type: string
          format: date-time
          nullable: true
        timeWindowEnd:
          type: string
          format: date-time
          nullable: true
        serviceDurationMin:
          type: integer
        weightKg:
          type: number
          nullable: true
        volumeM3:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - organizationId
        - address
        - latitude
        - longitude

    UpdateStopBody:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timeWindowStart:
          type: string
          format: date-time
          nullable: true
        timeWindowEnd:
          type: string
          format: date-time
          nullable: true
        serviceDurationMin:
          type: integer
        weightKg:
          type: number
          nullable: true
        volumeM3:
          type: number
          nullable: true
        status:
          type: string
          enum: [pending, in_progress, completed, failed, skipped]
        sequenceOrder:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true

    ImportStopsBody:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        stops:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              latitude:
                type: number
              longitude:
                type: number
              timeWindowStart:
                type: string
                format: date-time
                nullable: true
              timeWindowEnd:
                type: string
                format: date-time
                nullable: true
              serviceDurationMin:
                type: integer
              notes:
                type: string
                nullable: true
            required:
              - address
              - latitude
              - longitude
      required:
        - organizationId
        - stops

    ImportStopsResponse:
      type: object
      properties:
        imported:
          type: integer
        stops:
          type: array
          items:
