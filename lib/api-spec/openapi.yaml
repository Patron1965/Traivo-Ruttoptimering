        depotLongitude: { type: number, minimum: -180, maximum: 180 }
      required: [routes, depotLatitude, depotLongitude]

    WholePlanReoptimizationApplyInput:
      type: object
      additionalProperties: false
      properties:
        draftId: { type: ["string", "null"], format: uuid }
        draftRevision: { type: ["integer", "null"], minimum: 0 }
        routes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/WholePlanReoptimizationRouteRevision"
        pairs:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/WholePlanReoptimizationPair"
        depotLatitude: { type: number, minimum: -90, maximum: 90 }
        depotLongitude: { type: number, minimum: -180, maximum: 180 }
        proposalHash: { type: string, minLength: 64, maxLength: 64 }
      required:
