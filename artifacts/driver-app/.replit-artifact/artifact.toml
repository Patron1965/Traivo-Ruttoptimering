kind = "mobile"
previewPath = "/driver-app/"
title = "Traivo Route Driver"
version = "1.0.0"
id = "artifacts/driver-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 18809
name = "expo"
paths = ["/driver-app/"]

[services.development]
run = "pnpm --filter @workspace/driver-app run dev"

[services.env]
PORT = "18809"
BASE_PATH = "/driver-app/"

[services.production]
build = ["pnpm", "--filter", "@workspace/driver-app", "run", "build"]
run = ["pnpm", "--filter", "@workspace/driver-app", "run", "serve"]
